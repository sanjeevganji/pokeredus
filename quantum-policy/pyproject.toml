[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeredus-quantum"
version = "0.1.0"
description = "PennyLane QAOA action-probability policy for PokeRedus"
requires-python = ">=3.10"
dependencies = [
  "pennylane>=0.38",
  "numpy",
]

[tool.setuptools.packages.find]
include = ["pokeredus_quantum*"]
