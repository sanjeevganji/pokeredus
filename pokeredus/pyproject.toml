[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeredus"
version = "0.1.0"
description = "Class-based Pokémon knowledge graph and team-builder GUI (OU). Battle policy lives in the TypeScript packages plus quantum-policy."
readme = { text = "PokeRedus Python package: knowledge graph, pairwise matchups, and team-builder GUI. The live Random Battle policy is the TS engine + PennyLane QAOA subprocess documented in the repository root README.", content-type = "text/plain" }
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "networkx>=3.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
